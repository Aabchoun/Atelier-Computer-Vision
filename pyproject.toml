[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firespread"
version = "0.1.0"
description = "Fire Spread Simulator & Predictor: single-scene multi-agent computer vision system on satellite data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ml = ["torch>=2.1", "segmentation-models-pytorch>=0.3.3", "albumentations>=1.3"]
geo = ["rasterio>=1.3", "pyproj>=3.6", "xarray>=2023.1"]
gee = ["earthengine-api>=0.1.390"]
app = ["streamlit>=1.30", "rasterio>=1.3"]

[tool.setuptools.packages.find]
include = ["firespread*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
